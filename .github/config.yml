agent-ubuntu: ubuntu-24.04
build-image:
  # Authoritative configuration for build image/s
  repo: docker.io/envoyproxy/envoy-build
  repo-gcr: gcr.io/envoy-ci/envoy-build
  # default ci caching (ci)
  sha: 0b285a2c5e8fd85db238a6159f9748dac38569f081501bd508876076fecc3fe5
  sha-ci: 0b285a2c5e8fd85db238a6159f9748dac38569f081501bd508876076fecc3fe5
  sha-devtools: 9e7dee3f9ce05274cfeb79a629b6b4f9163edb7bed436daa567ca7b58a35dfac
  sha-docker: 511f15efe9e5fdb44f290e271bea982faaf279222ea36f9109c2ddc32d99931a
  sha-gcc: 61d798d4385162ba52b7f80316a15bea096feaa255e61365f842e9902843d6c4
  sha-client: a80317cd73e52bea46caa2fd7d12142f2afdaca372a903523e42b00bc5266680
  sha-worker: 936a89f86a2dff47a2027031a7c330e97eb05339c93d6742b0a2d9adc6680a12
  # TODO: remove this dupe (currently used by ci request handler)
  client-sha: a80317cd73e52bea46caa2fd7d12142f2afdaca372a903523e42b00bc5266680
  tag: v0.1.6

config:
  envoy:
    icon: >-
      [![](https://avatars.githubusercontent.com/u/30125649?s=24&v=4)](#)

checks:
  # Checks: this configures which _checks_ will be activated or skipped
  #
  # The configured _names_ need to match the checks configured for the repo
  #
  # Any check that is marked as `required` but is not triggered by the run
  # config above in a given CI run is marked as `skipped`
  #
  # For example if macos is marked as `required: true` but then has a path
  # selection that means its doesnt run the check will be `skipped` and pass
  checks:
    name: Envoy/Checks
    on-run:
    - check-build
    - check-build-openssl
    - check-coverage
    - check-runtime
    - check-san
    required: true
  macos:
    name: Envoy/macOS
    required: true
    on-run:
    - build-macos
  client-android:
    name: Client/Android
    required: true
    on-run:
    - client-android
  client-android-tests:
    name: Client/Android tests
    required: true
    on-run:
    - client-android-tests
  client-asan:
    name: Client/ASAN
    required: true
    on-run:
    - client-asan
  client-cc:
    name: Client/CC
    required: true
    on-run:
    - client-cc
  client-coverage:
    name: Client/Coverage
    required: true
    on-run:
    - client-coverage
  client-docs:
    name: Client/Docs
    on-run:
    - client-docs
  client-format:
    name: Client/Format
    required: true
    on-run:
    - client-format
  client-ios:
    name: Client/iOS
    required: true
    cache:
    on-run:
    - client-ios
  client-ios-tests:
    name: Client/iOS tests
    required: true
    on-run:
    - client-ios-tests
  client-python:
    name: Client/Python
    required: true
    on-run:
    - client-python
  client-release-validation:
    name: Client/Release validation
    required: true
    on-run:
    - client-release-validation
  client-tsan:
    name: Client/TSAN
    required: true
    on-run:
    - client-tsan
  prechecks:
    name: Envoy/Prechecks
    on-run:
    - precheck-deps
    - precheck-external
    - precheck-format
    - precheck-publish
    - precheck-publish-config
    required: true
    # yamllint disable rule:line-length
    advice:
      general: |
        ### Ensuring your commits are signed off

        You can set up DCO using Envoy's git hooks.

        ### Git hooks

        To set this up, do the following:

          ```console
          $ ./support/bootstrap
          ```

          If you only want the DCO check you can do the following to disable the
          other hooks

          ```console
          $ echo NO_VERIFY=1 > .env
          ```
      deps: |
        ### Advice on updating dependencies

        General information about Envoy's depdendencies [can be found here](https://github.com/envoyproxy/envoy/blob/main/DEPENDENCY_POLICY.md)
      format: |
        ### Advice on correct formatting

        Envoy ensures a minimum standard for all files in the repository.

        You are strongly advised to heed the following CI notice:

          ```console
            Please fix your editor to ensure:

              - no trailing whitespace
              - no preceding mixed tabs/spaces
              - all files end with a newline
          ```
    # yamllint enable rule:line-length
  publish:
    name: >-
      Envoy/Publish and verify
    on-run:
    - release
    - verify
    required: true

run:
  build-macos:
    paths:
    - .bazelrc
    - .bazelversion
    - .github/config.yml
    - api/**/*
    - bazel/**/*
    - ci/**/*
    - configs/**/*
    - contrib/**/*
    - envoy/**/*
    - source/**/*
    - test/**/*
  check-build:
    paths:
    - "**/*"
  check-build-openssl:
    paths:
    - "**/*"
  check-coverage:
    paths:
    - "**/*"
  check-runtime:
    paths:
    - source/server/cgroup_cpu_util.*
    - test/server/*cgroup*
    # this can be switched to always run once related ci lands.
    push: paths
  check-san:
    paths:
    - "**/*"
  client-android:
    paths:
    - .bazelrc
    - .bazelversion
    - .github/config.yml
    - bazel/external/quiche.BUILD
    - bazel/repository_locations.bzl
    - client/.bazelrc
    - client/**/*
    - source/common/**/*
    - tools/code_format/check_format.py
  client-android-all:
    paths:
    - .bazelrc
    - .bazelversion
    - .github/config.yml
    - bazel/external/quiche.BUILD
    - bazel/repository_locations.bzl
    - client/.bazelrc
    - client/**/*
    - source/common/**/*
    - tools/code_format/check_format.py
    push: never
  client-android-tests:
    paths:
    - .bazelrc
    - .bazelversion
    - .github/config.yml
    - bazel/external/quiche.BUILD
    - bazel/repository_locations.bzl
    - client/.bazelrc
    - client/**/*
    - tools/code_format/check_format.py
  client-asan:
