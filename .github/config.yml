    - .bazelversion
    - .github/config.yml
    - bazel/external/quiche.BUILD
    - bazel/repositories.bzl
    - bazel/repository_locations.bzl
    - client/.bazelrc
    - client/**/*
    - tools/code_format/check_format.py
  client-cc:
    paths:
    - .bazelrc
    - .bazelversion
    - .github/config.yml
    - api/**/*
    - bazel/external/quiche.BUILD
    - bazel/repositories.bzl
    - bazel/repository_locations.bzl
    - envoy/**/*
    - client/.bazelrc
    - client/**/*
    - source/**/*
    - test/config/**/*
    - test/integration/*
    - test/mocks/**/*
    - test/test_common/**/*
  client-coverage:
    paths:
    - .bazelrc
    - .bazelversion
    - .github/config.yml
    - bazel/external/quiche.BUILD
    - bazel/repositories.bzl
    - bazel/repository_locations.bzl
    - client/.bazelrc
    - client/**/*
    - test/run_envoy_bazel_coverage.sh
    - tools/code_format/check_format.py
    - tools/coverage/**/*
  client-format:
