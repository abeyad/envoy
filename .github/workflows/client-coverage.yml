name: Client/Coverage

permissions:
  contents: read

on:
  workflow_run:
    workflows:
    - Request
    types:
    - completed

concurrency:
  group: >-
    ${{ ((github.event.workflow_run.head_branch == 'main'
          || startsWith(github.event.workflow_run.head_branch, 'release/v'))
          && github.event.repository.full_name == github.repository)
        && github.run_id
        || github.event.workflow_run.head_branch }}-${{ github.event.repository.full_name }}-${{ github.workflow }}
  cancel-in-progress: true


jobs:
  load:
    secrets:
      app-key: ${{ secrets.ENVOY_CI_APP_KEY }}
      app-id: ${{ secrets.ENVOY_CI_APP_ID }}
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    if: |
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.repository.full_name == github.repository
      && contains(fromJSON('["pull_request_target", "push", "schedule"]'), github.event.workflow_run.event)
    uses: ./.github/workflows/_load.yml
    with:
      check-name: client-coverage

  coverage:
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      actions: read
      contents: read
      packages: read
    if: ${{ needs.load.outputs.request && fromJSON(needs.load.outputs.request).run.client-coverage }}
    needs: load
    name: Running mobile coverage
    uses: ./.github/workflows/_client_container_ci.yml
    with:
      args: >-
        //test/common/...
        //test/cc/...
      command: ../test/run_envoy_bazel_coverage.sh
      request: ${{ needs.load.outputs.request }}
      source: |
        export BAZEL_BUILD_OPTION_LIST="--config=ci --config=client-rbe --config=client-coverage"
      steps-post: |
        - name: Package coverage
          shell: bash
          run: |
            cd mobile
            tar -czf coverage.tar.gz generated/coverage
      target: client-coverage
      timeout-minutes: 120
      upload-name: coverage.tar.gz
      upload-path: client/coverage.tar.gz

  request:
    secrets:
      app-id: ${{ secrets.ENVOY_CI_APP_ID }}
      app-key: ${{ secrets.ENVOY_CI_APP_KEY }}
    permissions:
      actions: read
      contents: read
    if: |
      always()
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.repository.full_name == github.repository
      && contains(fromJSON('["pull_request_target", "push", "schedule"]'), github.event.workflow_run.event)
      && needs.load.outputs.request
      && fromJSON(needs.load.outputs.request).run.client-coverage
    needs:
    - load
    - coverage
    uses: ./.github/workflows/_finish.yml
    with:
      needs: ${{ toJSON(needs) }}
