name: Client/Docs

permissions:
  contents: read

on:
  workflow_run:
    workflows:
    - Request
    types:
    - completed

concurrency:
  group: >-
    ${{ ((github.event.workflow_run.head_branch == 'main'
          || startsWith(github.event.workflow_run.head_branch, 'release/v'))
          && github.event.repository.full_name == github.repository)
        && github.run_id
        || github.event.workflow_run.head_branch }}-${{ github.event.repository.full_name }}-${{ github.workflow }}
  cancel-in-progress: true


jobs:
  load:
    secrets:
      app-key: ${{ secrets.ENVOY_CI_APP_KEY }}
      app-id: ${{ secrets.ENVOY_CI_APP_ID }}
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    if: |
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.repository.full_name == github.repository
      && contains(fromJSON('["pull_request_target", "push", "schedule"]'), github.event.workflow_run.event)
    uses: ./.github/workflows/_load.yml
    with:
      check-name: client-docs

  docs:
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      ssh-key-extra: ${{ needs.load.outputs.trusted  && secrets.ENVOY_CLIENT_WEBSITE_DEPLOY_KEY || '' }}
    permissions:
      actions: read
      contents: read
      packages: read
    if: ${{ needs.load.outputs.request && fromJSON(needs.load.outputs.request).run.client-docs }}
    needs: load
    uses: ./.github/workflows/_run.yml
    with:
      args: >-
        --
      command: ./docs/build.sh
      request: ${{ needs.load.outputs.request }}
      target: client-docs
      cache-build-image: ${{ needs.load.outputs.build-image && fromJSON(needs.load.outputs.build-image).build-image || '' }}
      checkout-extra: |
        repository: envoy-client/envoy-client.github.io
        path: client-docs
        fetch-depth: 0
        branch: master
      docker-ipv6: false
      source: |
        echo "ENVOY_DOCKER_SOURCE_DIR=/source/mobile" >> $GITHUB_ENV
        # Path relative to ./mobile directory
        echo "MOBILE_DOCS_CHECKOUT_DIR=../client-docs" >> $GITHUB_ENV
      steps-post: |
        - name: Publish docs
          shell: bash
          run: |
            ./ci/run_envoy_docker.sh docs/publish.sh
        # This step needs to be done outside the container to access ssh creds
        - name: Push changes
          # && github.repository == 'envoyproxy/envoy'
          if: ${{ needs.load.outputs.trusted }}
          shell: bash
          run: |
            git -C client-docs status
            exit 0
            git -C client-docs push origin master
      timeout-minutes: 20
      trusted: ${{ needs.load.outputs.trusted && fromJSON(needs.load.outputs.trusted) || false }}
      upload-name: docs
      upload-path: client/generated/docs

  request:
    secrets:
      app-id: ${{ secrets.ENVOY_CI_APP_ID }}
      app-key: ${{ secrets.ENVOY_CI_APP_KEY }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    if: |
      always()
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.repository.full_name == github.repository
      && contains(fromJSON('["pull_request_target", "push", "schedule"]'), github.event.workflow_run.event)
      && needs.load.outputs.request
      && fromJSON(needs.load.outputs.request).run.client-docs
    needs:
    - load
    - docs
    uses: ./.github/workflows/_finish.yml
    with:
      needs: ${{ toJSON(needs) }}
